<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combe Downer: who's who</title>
  <meta name="description" content="Everyone you'll meet on the streets of Bath in Combe Downer, to turn round and look at.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@600;800&display=swap">
  <style>
    :root { --bg: #14171c; --panel: #1f242c; --ink: #eef0f2; --dim: #a7afba; --accent: #f2b134; --line: #323944; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Barlow Condensed", system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 12px 16px 6px; }
    h1 { font-family: Cinzel, serif; font-weight: 800; font-size: 22px; margin: 0; letter-spacing: 0.04em; color: var(--accent); }
    header p { margin: 2px 0 0; color: var(--dim); font-size: 15px; }
    header a { color: var(--accent); }
    main { flex: 1; display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
    #list { overflow-y: auto; padding: 8px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 4px; }
    .tabs button { flex: 1; text-align: center; font-weight: 600; }
    #list h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 10px 4px 2px; font-weight: 600; }
    button, select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 16px; text-align: left; cursor: pointer; }
    button:hover, select:hover { border-color: var(--accent); }
    button.on { background: var(--accent); color: #1a1408; border-color: var(--accent); }
    .stage { position: relative; min-height: 0; display: flex; flex-direction: column; }
    #view { flex: 1; width: 100%; min-height: 300px; display: block; touch-action: none; cursor: grab; }
    .info { position: absolute; left: 16px; top: 12px; pointer-events: none; max-width: 70%; text-shadow: 0 1px 3px #000; }
    #name { font-family: Cinzel, serif; font-size: 24px; font-weight: 800; }
    #blurb { color: var(--dim); font-size: 17px; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px 14px; border-top: 1px solid var(--line); }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .group > span { color: var(--dim); font-size: 15px; }
    .swatch { width: 28px; height: 28px; padding: 0; border-radius: 50%; }
    .swatch.on { outline: 2px solid var(--ink); outline-offset: 2px; }
    label { display: flex; gap: 6px; align-items: center; color: var(--dim); font-size: 16px; }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      #list { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      #list h2 { display: none; }
      #list button { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <header><h1>Combe Downer: who's who</h1><p>Everyone on the streets of Bath, players and all. Drag to turn round them, scroll to zoom, arrow keys to step through. The address always shows exactly what you are looking at, to share. The monsters and bosses of the mines are on the Under Combe Down tab. <a href="./">Play the game</a></p></header>
  <main>
    <nav id="list"></nav>
    <section class="stage">
      <canvas id="view"></canvas>
      <div class="info"><div id="name"></div><div id="blurb"></div></div>
      <div class="bar" id="bar"></div>
    </section>
  </main>
  <script type="module" src="./src/characters.ts"></script>
</body>
</html>
